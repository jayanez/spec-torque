<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpecTorque Desktop probe</title>
<h1>SpecTorque Desktop probe</h1>
<p role="status" id="connection">Connecting to host…</p>
<button type="button" id="read" disabled>Read probe marker</button>
<p role="status" id="result"></p>
<script>
  const connection = document.querySelector('#connection');
  const button = document.querySelector('#read');
  const result = document.querySelector('#result');
  const pending = new Map();
  let sequence = 0;
  let hostOrigin;

  function send(message) {
    // Opaque sandbox origins require "*". The known parent is the only recipient.
    parent.postMessage({ jsonrpc: '2.0', ...message }, !hostOrigin || hostOrigin === 'null' ? '*' : hostOrigin);
  }

  function request(method, params) {
    const id = ++sequence;
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        pending.delete(id);
        reject(new Error('Host response timed out.'));
      }, 8000);
      pending.set(id, { resolve, reject, timeout });
      send({ id, method, params });
    });
  }

  addEventListener('message', event => {
    if (event.source !== parent || (hostOrigin !== undefined && event.origin !== hostOrigin)) return;
    const message = event.data;
    if (message?.jsonrpc !== '2.0' || !pending.has(message.id)) return;
    if (!Object.hasOwn(message, 'result') && !Object.hasOwn(message, 'error')) return;
    const { resolve, reject, timeout } = pending.get(message.id);
    clearTimeout(timeout);
    pending.delete(message.id);
    if (message.error) reject(new Error('Host rejected the request.'));
    else {
      hostOrigin ??= event.origin;
      resolve(message.result);
    }
  });

  async function initialize() {
    if (parent === window) {
      connection.textContent = 'Open this resource through an MCP Apps host.';
      return;
    }
    try {
      const handshake = await request('ui/initialize', {
        appInfo: { name: 'spectorque-desktop-probe', version: '0.1.0' },
        appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
        protocolVersion: '2026-01-26',
      });
      if (handshake?.protocolVersion !== '2026-01-26') throw new Error('Unexpected bridge protocol version.');
      send({ method: 'ui/notifications/initialized', params: {} });
      const mode = handshake.hostContext?.displayMode;
      const placement = ['inline', 'fullscreen', 'pip'].includes(mode) ? mode : 'unspecified';
      connection.textContent = 'Bridge ready · ' + handshake.protocolVersion + ' · ' + placement;
      button.disabled = false;
    } catch (error) {
      connection.textContent = error.message;
    }
  }

  button.addEventListener('click', async () => {
    button.disabled = true;
    result.textContent = 'Reading…';
    try {
      const response = await request('tools/call', { name: 'read_probe', arguments: {} });
      const data = response?.structuredContent;
      if (response?.isError || data?.marker !== 'probe-second-read') throw new Error('Unexpected probe response.');
      result.textContent = data.marker + ' · cwd: ' + data.cwd;
    } catch (error) {
      result.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });

  void initialize();
</script>
</html>
