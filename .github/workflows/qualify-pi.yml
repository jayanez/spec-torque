name: Qualify installed Pi package
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/qualify-pi.yml'
      - 'scripts/qualify-pi*.mjs'
      - 'scripts/package-archive.mjs'
      - 'scripts/package-pi.mjs'
      - 'scripts/qualify-common-handoff.mjs'
      - 'fixtures/**'
      - 'scripts/package-integrations.mjs'
      - 'integrations/pi/**'
      - 'src/**'
      - 'skills/**'
      - 'package*.json'
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run package:integrations
      - run: npm run package:pi
      - if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: npx --no-install playwright install chromium
      - shell: bash
        run: |
          set -euo pipefail
          pi_prefix="$RUNNER_TEMP/spectorque-pi"
          npm install --prefix "$pi_prefix" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.5.2
          pty_prefix="$RUNNER_TEMP/spectorque-pty"
          npm install --prefix "$pty_prefix" --no-audit --no-fund node-pty@1.1.0
          if [[ "$RUNNER_OS" == macOS ]]; then
            chmod u+x "$pty_prefix/node_modules/node-pty/prebuilds/darwin-$(node -p 'process.arch')/spawn-helper"
          fi
          git rev-parse HEAD
          archive="artifacts/spectorque-pi-$(node -p "require('./integrations/pi/package.json').version").zip"
          npm run qualify:pi -- "$pi_prefix/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js" --installed-archive "$archive" --terminal-driver "$pty_prefix/node_modules/node-pty"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-handoff-${{ matrix.os }}
          path: |
            .spec-torque/handoff-*/
            artifacts/spectorque-pi-*.zip
          include-hidden-files: true
          if-no-files-found: ignore
