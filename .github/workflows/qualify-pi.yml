name: Qualify installed Pi package
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/qualify-pi.yml'
      - 'scripts/qualify-pi.mjs'
      - 'scripts/package-integrations.mjs'
      - 'integrations/pi/**'
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run package:integrations
      - shell: bash
        run: |
          set -euo pipefail
          pi_prefix="$RUNNER_TEMP/spectorque-pi"
          npm install --prefix "$pi_prefix" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.5.2
          git rev-parse HEAD
          npm run qualify:pi -- "$pi_prefix/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js" --installed-package integrations/pi
